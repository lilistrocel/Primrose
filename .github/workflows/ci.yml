name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18.x'
  MONGODB_VERSION: '7.0'

jobs:
  test:
    name: Test & Quality Checks
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin123
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: TypeScript Type Check
      run: npm run build

    - name: Run Linting
      run: |
        npm install -g eslint @typescript-eslint/parser @typescript-eslint/eslint-plugin
        npx eslint src/ --ext .ts --fix

    - name: Run Security Audit
      run: npm audit --audit-level=moderate

    - name: Run Tests
      env:
        NODE_ENV: test
        JWT_SECRET: test-secret-for-ci-32-characters-long
        MONGODB_URI: mongodb://admin:admin123@localhost:27017/primrose_test?authSource=admin
      run: npm run test:coverage

    - name: Upload Test Coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        fail_ci_if_error: false

    - name: Build Production
      run: npm run build

  docker-build:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: primrose-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Docker Security Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'primrose-backend:latest'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Security Scan Results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Deploy to Staging
      run: |
        echo "🚀 Deploying to staging environment..."
        echo "This would trigger staging deployment"
        # Add actual deployment commands here

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Deploy to Production
      run: |
        echo "🚀 Deploying to production environment..."
        echo "This would trigger production deployment"
        # Add actual deployment commands here 